name: Classroom security pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: Classroom scenario (regression is never deployed)
        type: choice
        options: [baseline, authorization-regression]
        default: baseline
permissions:
  contents: read
concurrency:
  group: classroom-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    name: Functional and security test cases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Apply isolated teaching regression
        if: github.event_name == 'workflow_dispatch' && inputs.scenario == 'authorization-regression'
        run: |
          python scripts/classroom_scenario.py
          git diff -- app.py
      - name: Verify application behavior
        run: python scripts/run_tests.py
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-case-results
          path: reports/tests.json
  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install bandit==1.9.4
      - run: mkdir -p reports && python -m bandit app.py wsgi.py -f json -o reports/bandit.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-results
          path: reports/bandit.json
  sca:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: mkdir -p reports && python -m pip_audit -r requirements.txt -f json -o reports/sca.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-results
          path: reports/sca.json
  secrets:
    name: Secret scanning - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 git /repo --redact --report-format json --report-path /repo/reports/secrets.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results
          path: reports/secrets.json
  dast:
    name: DAST - ZAP passive baseline (public routes)
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Start isolated target
        run: |
          mkdir -p reports
          python scripts/ci_server.py > reports/server.log 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:5000/health && exit 0; sleep 1; done
          exit 1
      - name: Scan temporary application
        run: |
          chmod 777 reports
          cp zap-rules.tsv reports/zap-rules.tsv
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://127.0.0.1:5000 -m 1 -I -c zap-rules.tsv -r zap.html -J zap.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-results
          path: |
            reports/zap.html
            reports/zap.json
  deploy:
    name: Deploy tested commit to Render
    needs: [tests, sast, sca, secrets, dast]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.scenario != 'authorization-regression' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: classroom
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Deploy and verify revision
        run: python scripts/deploy.py
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          APP_URL: ${{ vars.APP_URL }}
